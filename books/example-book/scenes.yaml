scenes:
  - id: S0001
    line: '01:1-5'
    summary: 开篇诗预示林冲风雪脱险

  - id: S0002
    line: '01:6-17'
    summary: 林冲在沧州与受过其恩惠的李小二重逢

  - id: S0003
    line: '01:18-20'
    summary: 李小二夫妻照料林冲并与他保持往来

  - id: S0004
    line: '02:1-37'
    summary: 陆谦等人在酒店宴请管营和差拨密谋害人

  - id: S0005
    line: '02:38-50'
    summary: 李小二向林冲报告可疑密谋

  - id: S0006
    line: '02:51-67'
    summary: 林冲寻仇未果后被调往草料场

  - id: S0007
    line: '02:68-99'
    summary: 林冲冒雪接管草料场并外出沽酒

  - id: S0008
    line: '02:100-107'
    summary: 草厅被雪压塌后林冲转往山神庙避宿

  - id: S0009
    line: '02:108-145'
    summary: 林冲听破纵火阴谋并杀死陆谦等人

  - id: S0010
    line: '02:146-173'
    summary: 林冲投宿庄院醉倒后被庄客捉住
