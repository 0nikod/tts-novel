endpoint: http://127.0.0.1:8000/v1/tts
model: custom-model
api_key_env: TTS_API_KEY
concurrency: 2
timeout_seconds: 120
retries: 2
output:
  sample_rate: 24000
  channels: 1
  final_format: mp3
assembly:
  dialogue_gap_ms: 180
  narration_gap_ms: 260
  scene_gap_ms: 800
  chapter_gap_ms: 1500
execution:
  max_chars_per_request: 200
