[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "novel-tts"
version = "0.1.0"
description = "Prepare and annotate novels for TTS pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
novel-tts = "novel_tts.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_tts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
